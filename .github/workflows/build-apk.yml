name: Compilar CodeVerse Android

 
on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão (ex.: 1.0.1). Vazio = a do update.json'
        required: false
        default: ''
      publicar:
        description: 'Publicar o APK numa Release (v<versão>)'
        type: boolean
        required: false
        default: false
  release:
    types: [published]
  push:
    paths:
      - '*.zip'
      - 'settings.gradle.kts'
      - 'app/**'
      - 'web/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Obter ficheiros do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar plataforma Android (SDK ja vem no runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Localizar projeto (extrai o ZIP se necessario)
        run: |
          rm -rf extracted_project
          if [ -f settings.gradle.kts ]; then
            mkdir extracted_project
            shopt -s dotglob
            for f in *; do
              if [ "$f" != "extracted_project" ] && [ "$f" != ".git" ]; then cp -r "$f" extracted_project/; fi
            done
          else
            Z=$(ls -1 ./*.zip 2>/dev/null | head -n 1 || true)
            if [ -z "$Z" ]; then
              echo "Erro: nenhum .zip encontrado na raiz do repositorio!"
              exit 1
            fi
            echo "A extrair $Z"
            unzip -q -o "$Z" -d extracted_project
          fi
          ROOT_PROJECT_DIR=$(find extracted_project \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1 | xargs -r dirname)
          if [ -z "$ROOT_PROJECT_DIR" ]; then
            echo "Erro: settings.gradle.kts nao encontrado no projeto!"
            exit 1
          fi
          echo "ROOT_PROJECT_DIR=$ROOT_PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Definir versao
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSAO: ${{ github.event.inputs.versao }}
        run: |
          V=""
          if [ -n "$RELEASE_TAG" ]; then V="${RELEASE_TAG#v}"
          elif [ -n "$INPUT_VERSAO" ]; then V="${INPUT_VERSAO#v}"
          elif [ -f "$ROOT_PROJECT_DIR/update.json" ]; then
            V=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('version',''))" "$ROOT_PROJECT_DIR/update.json" 2>/dev/null || true)
            V="${V#v}"
          fi
          if ! echo "$V" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            [ -n "$V" ] && echo "Versao '$V' invalida; a usar 1.0.1"
            V="1.0.1"
          fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "Versao do APK: $V"

      - name: Gerar interface web (editor + Python offline)
        env:
          # Segredos (Settings > Secrets and variables > Actions > Secrets).
          # Cada um pode ter varias chaves separadas por virgula: chave1,chave2,chave3
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          # Opcionais (separador Variables). Sem eles usa gemini-3.8-flash e openrouter/auto.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_REASONING: ${{ vars.GEMINI_REASONING }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          cd "$ROOT_PROJECT_DIR/web"
          npm install --no-audit --no-fund
          npm run build

      - name: Compilar BusyBox com o NDK (terminal Linux)
        run: |
          # O BusyBox tem de ser compilado contra o bionic (NDK), estático. Os binários musl de busybox.net
          # fazem syscalls que o Android bloqueia (SIGSYS, código 159). Se a compilação falhar, o APK sai na
          # mesma e o terminal usa a shell do Android (/system/bin/sh).
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          BBV=1.36.1
          LIBS="$GITHUB_WORKSPACE/$ROOT_PROJECT_DIR/app/src/main/jniLibs"
          WORK="$RUNNER_TEMP/busybox"
          mkdir -p "$WORK"
          if [ ! -d "$TC" ] || ! curl -fsSL --retry 3 --connect-timeout 20 -o "$WORK/bb.tar.bz2" "https://busybox.net/downloads/busybox-$BBV.tar.bz2"; then
            echo "::warning::NDK ou codigo-fonte do BusyBox indisponivel (o terminal usa a shell do Android)"
            exit 0
          fi
          tar -xjf "$WORK/bb.tar.bz2" -C "$WORK"
          SRC="$WORK/busybox-$BBV"
          build() {  # $1 = pasta ABI, $2 = triple do clang
            B="$WORK/out-$1"
            rm -rf "$B"; mkdir -p "$B"
            cp -r "$SRC/." "$B/"
            cd "$B"
            make defconfig > /dev/null
            cfg() { sed -i "s/^# CONFIG_$1 is not set/CONFIG_$1=y/;s/^CONFIG_$1=.*/CONFIG_$1=$2/" .config; }
            off() { for k in "$@"; do sed -i "s/^CONFIG_$k=.*/# CONFIG_$k is not set/" .config; done; }
            cfg STATIC y
            # Funcionalidades que o bionic nao tem (crypt, utmp, rpc, selinux, swap, syslog...) ou que dao erro com o NDK
            off SELINUX FEATURE_HAVE_RPC FEATURE_MOUNT_NFS FEATURE_UTMP FEATURE_WTMP WHO USERS LAST WALL \
                SWAPONOFF FEATURE_SWAPON_DISCARD FEATURE_SWAPON_PRI HOSTID SYSLOGD KLOGD LOGGER LOGREAD \
                FEATURE_SHADOWPASSWDS FEATURE_USE_SENDFILE LOGIN SU SULOGIN PASSWD ADDUSER ADDGROUP DELUSER DELGROUP \
                GETTY VLOCK CRYPTPW MKPASSWD CHPASSWD TC NSENTER UNSHARE FSCK_MINIX MKFS_MINIX MKFS_EXT2 MKFS_REISER \
                MKFS_VFAT SHA1_HWACCEL SHA256_HWACCEL FEATURE_EJECT_SCSI EJECT FEATURE_TELNETD_STANDALONE TELNETD \
                HUSH SHELL_HUSH INIT LINUXRC HALT POWEROFF REBOOT FEATURE_SYSTEMD UDHCPD UDHCPC UDHCPC6 DHCPRELAY \
                DUMPLEASES PAM FEATURE_IPV6 PING6 TRACEROUTE6 UBIATTACH UBIDETACH UBIMKVOL UBIRMVOL UBIRSVOL UBIUPDATEVOL UBIRENAME
            yes "" | make oldconfig > /dev/null 2>&1 || true
            make -j"$(nproc)" \
              CC="$TC/$2-clang" HOSTCC=gcc AR="$TC/llvm-ar" STRIP="$TC/llvm-strip" CONFIG_CROSS_COMPILER_PREFIX="" \
              EXTRA_CFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types" \
              busybox > "$WORK/build-$1.log" 2>&1 || { tail -40 "$WORK/build-$1.log"; return 1; }
            mkdir -p "$LIBS/$1"
            cp busybox "$LIBS/$1/libbusybox.so"
            chmod 755 "$LIBS/$1/libbusybox.so"
            echo "BusyBox $1 OK ($(stat -c %s "$LIBS/$1/libbusybox.so") bytes)"
          }
          for t in "arm64-v8a aarch64-linux-android26" "armeabi-v7a armv7a-linux-androideabi26" "x86_64 x86_64-linux-android26"; do
            set -- $t
            ( build "$1" "$2" ) || echo "::warning::Falhou o BusyBox $1 (o terminal usa a shell do Android nesse ABI)"
          done

      - name: Compilar APK
        run: |
          cd "$ROOT_PROJECT_DIR"
          set -o pipefail
          gradle :app:assembleDebug -PappVersion="$APP_VERSION" --no-daemon --console=plain 2>&1 | tee build.log || {
            echo "===== ERROS DE COMPILACAO ====="
            grep -E "^e: |What went wrong" -A4 build.log | head -80
            exit 1
          }

      - name: Preparar APK
        run: |
          APK=$(ls "$ROOT_PROJECT_DIR"/app/build/outputs/apk/debug/*.apk | head -n 1)
          mkdir -p dist
          cp "$APK" dist/CodeVerse.apk
          ls -l dist

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeVerse-Mobile-APK
          path: dist/CodeVerse.apk
          if-no-files-found: error

      - name: Anexar APK a Release
        if: github.event_name == 'release' || github.event.inputs.publicar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${RELEASE_TAG:-v$APP_VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/CodeVerse.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/CodeVerse.apk --repo "$GITHUB_REPOSITORY" \
              --title "CodeVerse $APP_VERSION" --notes "CodeVerse $APP_VERSION"
          fi
          echo "APK publicado em $TAG"
